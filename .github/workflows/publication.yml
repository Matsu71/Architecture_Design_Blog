name: Assemble reviewed publication
on:
  push:
    branches: ['improve/**']
    paths: ['data/publication-request.json']
permissions:
  contents: read
concurrency:
  group: publication-${{ github.ref }}
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build verified derivatives and static articles
        run: |
          python -m pip install Pillow==12.3.0 playwright==1.55.0
          node scripts/apply-reviewed-revision.mjs
          python scripts/build-reviewed-photos.py
          npm run build:articles
          npm run validate
          npm test
      - name: Real browser integration
        run: |
          python -m playwright install --with-deps chromium webkit
          python tests/browser_integration.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publication-browser-report
          path: qa/integration/
          retention-days: 7
      - name: Package generated files only
        run: |
          mkdir -p publication
          tar -czf publication/generated.tar.gz data/buildings.json articles catalogue.html data/map-index.json data/building-footprints.geojson assets/photos
      - uses: actions/upload-artifact@v4
        with:
          name: verified-generated-publication
          path: publication/generated.tar.gz
          retention-days: 7
  commit:
    needs: assemble
    if: startsWith(github.ref, 'refs/heads/improve/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: verified-generated-publication
          path: publication
      - name: Commit generated files to the same work branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          tar -xzf publication/generated.tar.gz
          git add data/buildings.json articles catalogue.html data/map-index.json data/building-footprints.geojson assets/photos
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Assemble tested articles and licensed photographs'
          git push origin "HEAD:refs/heads/$BRANCH"
