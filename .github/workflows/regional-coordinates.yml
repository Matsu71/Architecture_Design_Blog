name: Named regional coordinates
on:
  push:
    branches: ['improve/regional-20260914']
    paths: ['scripts/review-regional-coordinates.py', '.github/workflows/regional-coordinates.yml']
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/review-regional-coordinates.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: named-regional-coordinates
          path: qa/regional-coordinates/
          retention-days: 7
