name: Assemble Kanto expansion
on:
  push:
    branches: ['improve/kanto-expansion-20260914']
    paths: ['data/kanto-publication-request.json']
permissions:
  contents: read
concurrency:
  group: kanto-publication-${{ github.ref }}
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply reviewed records and implementation
        run: |
          python data/revisions/kanto-buildings-20260914.py
          echo '16c4231d97e1f7a15b56d4a49184de06c9a99ed1b88d4040eba8c53828de83f8  data/additions/kanto-20260914.json' | sha256sum -c -
          python scripts/apply-kanto-ui.py
          node scripts/apply-kanto-expansion.mjs
          cp data/revisions/kanto-expansion.test.mjs tests/kanto-expansion.test.mjs
          npm run build:articles
          npm run validate
          npm test
      - name: Genuine browser checks
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium webkit
          python tests/browser_integration.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kanto-browser-report
          path: qa/integration/
          retention-days: 7
      - name: Package tested changes only
        run: |
          mkdir -p publication
          tar -czf publication/kanto.tar.gz about.html assets/core.mjs assets/refinements.css scripts/build-articles.mjs scripts/validate-data.mjs tests/core.test.mjs tests/browser_integration.py tests/public_smoke.py tests/kanto-expansion.test.mjs data/additions/kanto-20260914.json data/additions/kanto-osm-evidence.geojson data/buildings.json data/map-index.json data/building-footprints.geojson catalogue.html articles
      - uses: actions/upload-artifact@v4
        with:
          name: verified-kanto-publication
          path: publication/kanto.tar.gz
          retention-days: 7
  commit:
    needs: assemble
    if: github.ref == 'refs/heads/improve/kanto-expansion-20260914'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: verified-kanto-publication
          path: publication
      - name: Commit only verified files to the work branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          tar -xzf publication/kanto.tar.gz
          git add about.html assets/core.mjs assets/refinements.css scripts/build-articles.mjs scripts/validate-data.mjs tests/core.test.mjs tests/browser_integration.py tests/public_smoke.py tests/kanto-expansion.test.mjs data/additions/kanto-20260914.json data/additions/kanto-osm-evidence.geojson data/buildings.json data/map-index.json data/building-footprints.geojson catalogue.html articles
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish tested Kanto batch: 20 buildings with qualified dates and design roles'
          git push origin "HEAD:refs/heads/$BRANCH"
