name: Regional source review
on:
  push:
    branches: ['improve/regional-20260914']
    paths: ['scripts/review-regional-sources.py', '.github/workflows/regional-sources.yml']
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/review-regional-sources.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regional-source-review
          path: qa/regional-sources/
          retention-days: 7
