name: Location source audit
on:
  push:
    branches: ['improve/**']
    paths: ['scripts/audit-location-sources.py', '.github/workflows/location-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect footprint candidates without editing data
        run: python scripts/audit-location-sources.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: location-source-evidence
          path: qa/location-audit/
          retention-days: 7
