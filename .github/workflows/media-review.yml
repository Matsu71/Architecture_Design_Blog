name: Reviewed media collection
on:
  push:
    branches: ['improve/**']
    paths: ['scripts/collect-reviewed-media.py', '.github/workflows/media-review.yml']
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/collect-reviewed-media.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewed-media-sources
          path: qa/media-review/
          retention-days: 2
