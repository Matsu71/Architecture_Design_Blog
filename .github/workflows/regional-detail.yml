name: Regional detail evidence
on:
  push:
    branches: ['improve/regional-20260914']
    paths: ['scripts/review-regional-locations.py', '.github/workflows/regional-detail.yml']
permissions:
  contents: read
jobs:
  detail:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/review-regional-locations.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regional-detail-evidence
          path: qa/regional-detail/
          retention-days: 7
